name: ci-cd-front

# Build, lint, test, scan, and deploy the LiveMenu frontend.
# Same security gate as the backend pipeline (Trivy HIGH/CRITICAL = block).
#
# Required repository config:
#   * vars.GCP_PROJECT_ID
#   * vars.GCP_REGION
#   * vars.GCP_AR_REPO              (livemenu-<suffix>)
#   * vars.GCP_FRONT_SERVICE        (livemenu-frontend-<suffix>)
#   * vars.VITE_API_BASE_URL        (https://<domain>/api/v1)
#   * secrets.GCP_WIF_PROVIDER
#   * secrets.GCP_DEPLOYER_SA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm test

  build-scan:
    name: Build image + Trivy scan
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # The API base URL is baked into the JS bundle at build time, so we have
      # to pass it as a build arg. For PR previews you may want a separate
      # value here.
      - name: Build (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: livemenu-frontend:${{ steps.meta.outputs.short_sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — gating scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: livemenu-frontend:${{ steps.meta.outputs.short_sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
          format: table

      - name: Trivy — full SARIF report
        if: always()
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: livemenu-frontend:${{ steps.meta.outputs.short_sha }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-front

  deploy:
    name: Push & deploy
    runs-on: ubuntu-latest
    needs: build-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/frontend:${{ needs.build-scan.outputs.image_tag }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/frontend:latest
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy a new Cloud Run revision
        run: |
          gcloud run deploy ${{ vars.GCP_FRONT_SERVICE }} \
            --image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/frontend:${{ needs.build-scan.outputs.image_tag }} \
            --region=${{ vars.GCP_REGION }} \
            --quiet
