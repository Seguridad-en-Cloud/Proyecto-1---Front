server {
    # 8080 because nginx-unprivileged runs as a non-root user and cannot
    # bind to ports below 1024. Cloud Run also defaults to PORT=8080.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Defense-in-depth: WAF/Cloud Armor + LB also send these on the way out,
    # but we set them at the origin so they're enforced when serving directly.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # SPA: every unknown path falls back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache + immutable for hashed assets emitted by Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
